name: Atualizar eventos automaticamente

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Buscar eventos em fontes RSS
        run: python automacao/coletar_eventos.py
      - name: Salvar eventos e fila de revisão
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eventos-auto.js aprovacao/pendentes.json
          git diff --cached --quiet || git commit -m "Atualiza eventos encontrados automaticamente"
          git push

